name: JiheDrive

options:
  bundleIdPrefix: com.liruixin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"

targets:
  JiheDrive:
    type: application
    platform: iOS
    sources:
      - path: JiheDrive
        excludes:
          - "Info.plist"
          - "JiheDrive.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liruixin.jihedrive
        PRODUCT_NAME: JiheDrive
        INFOPLIST_FILE: JiheDrive/Info.plist
        CODE_SIGN_ENTITLEMENTS: JiheDrive/JiheDrive.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: JiheDriveWidget
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: Security.framework
      - sdk: PhotosUI.framework
      - sdk: AVFoundation.framework
      - sdk: SceneKit.framework
      - sdk: ModelIO.framework
      - sdk: WebKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: UserNotifications.framework
      - sdk: Network.framework
      - sdk: CoreBluetooth.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: ExternalAccessory.framework
    entitlements:
      path: JiheDrive/JiheDrive.entitlements

  JiheDriveWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: JiheDriveWidget
        excludes:
          - "Info.plist"
          - "JiheDriveWidget.entitlements"
      - path: JiheDrive/Core/WidgetSnapshot.swift
      - path: JiheDrive/Core/WidgetLiveSync.swift
      - path: JiheDrive/Core/ZeehoClient.swift
      - path: JiheDrive/Core/ZeehoSigner.swift
      - path: JiheDrive/Core/H5Client.swift
      - path: JiheDrive/Core/KeychainStore.swift
      - path: JiheDrive/Core/Models.swift
      - path: JiheDrive/Core/TireService.swift
      - path: JiheDrive/Core/RideTrackService.swift
      - path: JiheDrive/Core/CommunityTask.swift
      - path: JiheDrive/Core/SigninInfo.swift
      - path: JiheDrive/Core/ChargeActivityAttributes.swift
      - path: JiheDrive/Core/BatteryInfo.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liruixin.jihedrive.widget
        PRODUCT_NAME: JiheDriveWidget
        INFOPLIST_FILE: JiheDriveWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: JiheDriveWidget/JiheDriveWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: "YES"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: ActivityKit.framework
      - sdk: Security.framework
      - sdk: CryptoKit.framework
    entitlements:
      path: JiheDriveWidget/JiheDriveWidget.entitlements
    info:
      path: JiheDriveWidget/Info.plist
      properties:
        CFBundleDisplayName: 极核智行
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  JiheDrive:
    build:
      targets:
        JiheDrive: all
        JiheDriveWidget: all
    run:
      config: Debug
    archive:
      config: Release
