name: JiheDrive

options:
  bundleIdPrefix: com.liruixin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"

targets:
  JiheDrive:
    type: application
    platform: iOS
    sources:
      - path: JiheDrive
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liruixin.jihedrive
        PRODUCT_NAME: JiheDrive
        INFOPLIST_FILE: JiheDrive/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: Security.framework
      - sdk: PhotosUI.framework
      - sdk: AVFoundation.framework
      - sdk: SceneKit.framework
      - sdk: UniformTypeIdentifiers.framework

schemes:
  JiheDrive:
    build:
      targets:
        JiheDrive: all
    run:
      config: Debug
    archive:
      config: Release
